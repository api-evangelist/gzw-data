versioning:
  scheme: path-prefix
  current: v1
  path: /api/v1
  legacy_path: /api
  legacy_policy: >-
    "Both prefixes currently expose the same API contract. New integrations should prefer /api/v1."
    The legacy /api prefix is described as compatibility-only but carries NO announced end date and
    NO Deprecation/Sunset header — probed 2026-08-26, neither header is returned on /api/weapons.
  product_version: 4.0.0 (info.version in the OpenAPI; independent of the v1 path prefix)
deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations: []
  note: >-
    No deprecation policy page exists and the OpenAPI marks no operation deprecated: true.
    The Terms of Service state the opposite of a deprecation guarantee — "We may change, limit,
    suspend, or discontinue any endpoint or feature without notice." No Deprecation pointer is
    emitted, because the provider publishes no policy.
status_page:
  published: false
  url: null
  note: >-
    There is no status page. The API does expose GET /api/v1/health (200; ok/status/ready/
    apiVersion/version/datasetCount/last-scrape) and GET /api/v1/ready (documented to return 503
    until datasets load). Those are machine health probes an operator can poll — they are NOT a
    published status page, so no StatusPage pointer is emitted.
  health_endpoints:
  - url: https://gzw-data.dev/api/v1/health
    status: 200
  - url: https://gzw-data.dev/api/v1/ready
    documented_behavior: 503 until datasets are loaded
