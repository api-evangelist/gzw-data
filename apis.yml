name: GZW Data API
aid: gzw-data
description: GZW Data is a free, fan-made, read-only REST API for Gray Zone Warfare game data, published by independent maintainer
  ZoniBoy00 and hosted on Vercel at gzw-data.dev. It exposes 85+ datasets auto-discovered from a wiki-scraped data directory
  - weapons, ammo, armor, magazines, attachments, tasks and missions, keys and keycards, loot containers, medical, provisions,
  gear and vendors - behind one uniform JSON envelope with equality filters, full-text search, sorting and page-number pagination.
  Three smart routes union related datasets (armor, weapon_parts, helmet_mods). There is no authentication, no account and
  no API key; access is governed by a best-effort limit of 100 requests per minute per IP with X-RateLimit-* headers. An OpenAPI
  3.0.3 contract, an llms.txt and a zero-dependency TypeScript client on npm are published. Data is scraped weekly from the
  community GZW Fandom Wiki; the project is unofficial and not affiliated with the game's publisher.
