note: >-
  The GZW Data model is WIDE AND FLAT: 85 auto-discovered dataset entities, every one a flat object
  of string fields, with NO $ref links between schemas anywhere in the spec. The relationships below
  are therefore SOFT — they are name-valued cross-references (e.g. a weapon's sold_by holds a vendor's
  display NAME, not a vendor id), derived from field-name analysis across all 85 schemas plus live
  record inspection. They are NOT declared by the provider and cannot be resolved with a single
  request; a consumer must search the target dataset by name. Recorded as low/medium confidence
  accordingly. Nothing here is invented — every field named below exists in the published schemas.
