smart_routes:
  note: >-
    Three published routes are UNIONS of other datasets rather than datasets of their own. They are
    the closest thing in this API to a modelled relationship, and the provider documents them as
    "smart routes".
  routes:
  - path: /api/v1/armor
    union_of: [vests, helmets, glasses]
  - path: /api/v1/weapon_parts
    union_of: all weapon-part datasets combined
  - path: /api/v1/helmet_mods
    union_of: [night_vision, mounts]
modelling_gaps:
- No $ref between any two schemas — the 85 entities are structurally independent in the contract.
- Cross-references carry display NAMES, not ids, so no reference is directly dereferenceable.
- Numeric quantities (weight, prices, fire_rate, accuracy) are typed as string with units embedded.
- 'additionalProperties: true on every dataset schema — new wiki fields appear without a spec change.'
- Near-duplicate dataset pairs exist (contract/contracts, plate_carrier/plate_carriers, loot_container/loot_containers) as an artifact of wiki category auto-discovery.
