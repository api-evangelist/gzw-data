note: The field vocabulary of the GZW Data API, derived by counting every property name across the 85 dataset record
  schemas the provider publishes. The provider does not publish a vocabulary, glossary or data dictionary of its
  own — the schemas are GENERATED from observed scraped data, so this vocabulary is an observation of that data,
  and a term can appear or disappear when the weekly wiki scrape changes. EVERY value in this API is typed `string`,
  including prices, weights and rates, which is the single most important thing a consumer needs to know before
  parsing. Definitions are written only for terms whose meaning is established by the published schemas, the docs,
  or a live probe recorded elsewhere in this repo; terms without a definition are listed with their spread and left
  undefined rather than guessed at.
scope: 85 dataset record schemas; the 7 envelope schemas (ApiError, ApiErrorResponse, ObjectResponse, PaginatedResponse,
  RecordResponse, MetadataResponse, Capabilities) are excluded and documented in conventions/ instead.
all_values_are_strings: true
term_count: 80
universal_terms:
