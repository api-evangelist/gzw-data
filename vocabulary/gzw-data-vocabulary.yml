envelope_terms:
- term: data
  definition: The payload — an object for a single record, an array for a collection, a keyed object for /search.
- term: count
  definition: Records in THIS response.
- term: page
  definition: 1-based page number.
- term: perPage
  definition: Page size actually applied. Compare against what you asked for — out-of-range values return 200, not
    4xx.
- term: total
  definition: Records matching the filter across all pages.
- term: totalPages
  definition: Page count; stop paging here.
- term: source
  definition: Always the literal "GZW Data API".
- term: timestamp
  definition: ISO 8601 time the response was generated.
- term: dataVersion
  definition: ISO 8601 timestamp of the wiki scrape snapshot the response was served from. The freshness signal
    — see changelog/gzw-data-changelog.yml.
- term: snapshotId
  definition: Opaque id of the stored dataset snapshot, on /api/v1/version and /api/v1/changes.
