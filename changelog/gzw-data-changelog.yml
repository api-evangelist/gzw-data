source: https://gzw-data.dev/api/v1/changes + https://gzw-data.dev/api/v1/version (probed 2026-09-03) + https://gzw-data.dev/docs/ ("Snapshot / Version information")
docs: https://gzw-data.dev/docs/
note: >-
  READ THIS BEFORE TRUSTING THE POINTER. GZW Data publishes NO prose changelog for the API — no
  CHANGELOG.md in either repository (both 404), zero GitHub releases on either repo, and no
  dated "what's new" page on the site. What it DOES publish, and what this artifact records, is a
  MACHINE-READABLE DATA CHANGE FEED added in implementation 4.2.0: GET /api/v1/changes diffs the
  current dataset snapshot against the previously stored one, and GET /api/v1/version pins the
  implementation version, the data snapshot id and the per-dataset record counts. For a scraped
  data product that is the change surface that actually matters to a consumer — it answers "did
  the data I cached change, and which datasets" — but it is NOT an API changelog and it will not
  tell you that an endpoint was added or a response shape changed. Both facts are recorded here
  rather than one being dressed up as the other.
scheme:
  api_version: path-prefix (/api/v1); unchanged since first observation
  implementation_version: semver, exposed as info.version in the OpenAPI and implementationVersion in /api/v1/version
  data_version: ISO 8601 timestamp of the scrape snapshot, returned as dataVersion on EVERY response
