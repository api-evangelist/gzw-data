entries:
- version: 4.2.0
  date: '2026-09-03'
  date_basis: first observed by API Evangelist on this date; the provider publishes no release date
  breaking: false
  additions:
  - GET /api/v1/version — implementation version, snapshot id and per-dataset counts
  - GET /api/v1/changes — snapshot-to-snapshot dataset diff
  - GET /api/v1/schema/{dataset} — per-dataset generated field metadata for code generators
  - GET /api/v1/items/{id}/context — resolves an item's soft vendor reference into real vendor objects
  - GET /api/v1/search — cross-dataset search, previously live but ABSENT from the contract, now declared in it
  - datasets funds and removed_content
  contract_changes:
  - every one of the 362 operations now declares 200/400/404/429 responses (0 of 352 did in 4.0.0)
  - 176 operations now declare their path parameters
  - new shared response schemas ObjectResponse, PaginatedResponse, RecordResponse, MetadataResponse, Capabilities
  - the 429 response declares a Retry-After header
  - path count 352 to 362, component schemas 87 to 92
  evidence:
    url: https://gzw-data.dev/api/v1/spec
    status: 200
    fetched: '2026-09-03'
  note: >-
    Diffed by API Evangelist against the 4.0.0 document harvested from the same URL on 2026-08-26.
    No path was removed. The provider announced none of this anywhere we could find.
