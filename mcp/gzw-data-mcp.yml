candidate_tools:
- name: list_dataset
  description: List records from any auto-discovered GZW dataset, with filter, search, sort and pagination.
  rest: GET /api/v1/{dataset}
  read_only: true
- name: get_record
  description: Retrieve one GZW record by its exact string id.
  rest: GET /api/v1/{dataset}/{id}
  read_only: true
- name: list_datasets
  description: Return the dataset registry with item counts and observed field names.
  rest: GET /api/v1/metadata
  read_only: true
- name: describe_dataset
  description: Return detailed generated field metadata (types, optionality, example values) for one dataset.
  rest: GET /api/v1/metadata/{dataset}
  read_only: true
- name: search_all
  description: Cross-dataset full-text search. Live and documented, but ABSENT from the published OpenAPI.
  rest: GET /api/v1/search?q={query}
  read_only: true
  note: undocumented-in-spec
- name: dataset_stats
  description: Item counts for every dataset plus the latest scrape timestamp. Live and documented, but ABSENT from the published OpenAPI.
  rest: GET /api/v1/stats
  read_only: true
  note: undocumented-in-spec
- name: api_health
  description: Health/readiness, dataset count and last scrape time.
  rest: GET /api/v1/health
  read_only: true
- name: get_version
  description: Implementation version, API version, data snapshot id and per-dataset record counts.
  rest: GET /api/v1/version
  read_only: true
  note: added in implementation 4.2.0; declared in the contract
- name: get_changes
  description: Diff of the current dataset snapshot against the previously stored one (added/removed datasets).
  rest: GET /api/v1/changes
  read_only: true
  note: added in implementation 4.2.0; declared in the contract
- name: get_dataset_schema
  description: Generated field metadata for one dataset — types, presence counts, optional/nullable flags and an example value.
  rest: GET /api/v1/schema/{dataset}
  read_only: true
  note: added in implementation 4.2.0; declared in the contract
- name: get_item_context
  description: Resolve one item's soft vendor reference into real vendor objects plus textual cross-references.
  rest: GET /api/v1/items/{id}/context
  read_only: true
  note: added in implementation 4.2.0; scoped to the `items` dataset only
