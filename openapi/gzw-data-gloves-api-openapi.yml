components:
  schemas:
    PaginatedResponse:
      allOf:
      - $ref: '#/components/schemas/ObjectResponse'
      - type: object
        properties:
          data:
            type: array
            items:
              type: object
          count:
            type: integer
          page:
            type: integer
          perPage:
            type: integer
          total:
            type: integer
          totalPages:
            type: integer
    ApiError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: DATASET_NOT_FOUND
        message:
          type: string
          example: Dataset not found
        dataset:
          type: string
        id:
          type: string
      additionalProperties: true
    RecordResponse:
      allOf:
      - $ref: '#/components/schemas/ObjectResponse'
      - type: object
        properties:
          data:
            type: object
    ApiErrorResponse:
      type: object
      required:
      - error
      - source
      - timestamp
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
        source:
          type: string
          example: GZW Data API
        timestamp:
          type: string
          format: date-time
    ObjectResponse:
      type: object
      required:
      - data
      - source
      - timestamp
      properties:
        data: {}
        source:
          type: string
        timestamp:
          type: string
          format: date-time
        dataVersion:
          type: string
        apiVersion:
          type: string
          example: v1
        implementationVersion:
          type: string
          example: 4.2.0
      additionalProperties: true
