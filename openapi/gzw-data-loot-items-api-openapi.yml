    get:
      summary: Get one loot_items record by id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Loot Items
  /api/v1/loot_items:
    get:
      summary: loot_items (120 items)
      tags:
      - Loot Items
  /api/v1/loot_items/{id}:
    get:
      summary: Get one loot_items record by id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      tags:
      - Loot Items
